<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ግምጃዬ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&family=Noto+Serif+Ethiopic:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#faf6ee;--card:#fff;--ink:#2b2118;--muted:#7a6a58;--brand:#8a4b1f;--brand2:#b5651d;--line:#e8dfd0}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Ethiopic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
/* የጀርባ ፎቶ: bg.jpg ከ index.html ጎን ካለ ይታያል (በስልክም ይሰራል) */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(250,246,238,.78),rgba(250,246,238,.78)),url('bg.jpg') center 18%/cover no-repeat}
main>h2,main>p.muted,footer{background:rgba(255,255,255,.88);border-radius:10px;padding:8px 12px}
footer{margin:14px auto 20px;max-width:700px}
header{background:var(--brand);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:20px;cursor:pointer}
nav button{background:transparent;color:#fff;border:1px solid #ffffff66;padding:6px 12px;border-radius:8px;margin-left:6px;font:inherit;cursor:pointer}
main{max-width:700px;margin:0 auto;padding:16px}
footer{text-align:center;padding:20px;font-size:13px;color:var(--muted)}
footer a{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(to bottom,rgba(60,30,10,0) 30%,rgba(60,30,10,.93) 82%),url('bg.jpg') center 15%/cover no-repeat,var(--brand);color:#fff;border-radius:14px;padding:20px;text-align:center;margin-bottom:14px;min-height:340px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.hero h2{margin:0 0 4px}
.hero .big{font-size:34px;font-weight:700}
.price{font-weight:700;color:var(--brand)}
button.btn{background:var(--brand);color:#fff;border:0;padding:12px 16px;border-radius:10px;font:inherit;cursor:pointer;width:100%;margin-top:8px}
button.btn.alt{background:#fff;color:var(--brand);border:1px solid var(--brand)}
button.btn.red{background:#a32d2d}
.hero button.btn{background:#fff;color:var(--brand);font-weight:700}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:6px 0}
.msg{padding:10px;border-radius:10px;margin:10px 0;background:#fff3d6}
.msg.err{background:#fde0e0}.msg.ok{background:#dff3df}
.muted{color:var(--muted);font-size:14px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px}
.pending{background:#fff3d6}.approved{background:#dff3df}.rejected{background:#fde0e0}
.player{position:relative;margin-top:10px;padding-top:14px}
.player audio{width:100%}
.wm{position:absolute;left:0;top:0;font-size:11px;color:#0000002e;pointer-events:none;white-space:nowrap;animation:mv 18s linear infinite}
@keyframes mv{0%{left:0}50%{left:55%}100%{left:0}}
.back{background:none;border:0;color:var(--brand);font:inherit;cursor:pointer;padding:0;margin-bottom:10px}
a{color:var(--brand)}
.cover-img{display:block;width:100%;height:auto;border-radius:14px}
/* ===== 3D ተጽእኖዎች ===== */
/* 3D መጽሐፍ: በጣት ይሽከረከራል */
.stage{--bw:min(58vw,270px);--bh:calc(var(--bw)*1.593);--bt:calc(var(--bw)*.11);position:relative;height:calc(var(--bh) + 70px);perspective:1100px;display:flex;align-items:center;justify-content:center;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;margin:0 auto 2px}
.stage:active{cursor:grabbing}
.book{position:relative;width:var(--bw);height:var(--bh);transform-style:preserve-3d;will-change:transform}
.face{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{inset:0;transform:translateZ(calc(var(--bt)/2));border-radius:3px 9px 9px 3px;overflow:hidden;background:linear-gradient(160deg,#2a1a3d,#120a1c);display:flex;align-items:center;justify-content:center;color:#d8b25a;font-size:36px;font-weight:700}
.front img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 36%,rgba(255,255,255,.34) 48%,transparent 60%);background-size:260% 100%}
.back{inset:0;transform:rotateY(180deg) translateZ(calc(var(--bt)/2));border-radius:9px 3px 3px 9px;background:linear-gradient(160deg,#2a1a3d,#120a1c);display:flex;align-items:center;justify-content:center;text-align:center;color:#d8b25a;font-weight:700;font-size:28px;line-height:1.3}
.back{overflow:hidden}
.back img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.back small{display:block;font:600 11px/1.4 sans-serif;letter-spacing:.22em;opacity:.85;margin-top:8px}
.spine{width:var(--bt);height:100%;left:calc((var(--bw) - var(--bt))/2);top:0;transform:rotateY(-90deg) translateZ(calc(var(--bw)/2));background:#1a0d26;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#d8b25a;font-weight:700}
.spine img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
.spine span{writing-mode:vertical-rl;font-size:calc(var(--bt)*.55);letter-spacing:.14em}
.pages{width:var(--bt);height:calc(100% - 8px);top:4px;left:calc((var(--bw) - var(--bt))/2);transform:rotateY(90deg) translateZ(calc(var(--bw)/2 - 4px));background:repeating-linear-gradient(90deg,#f4ecd9 0 2px,#d6c9ad 2px 3px)}
.top,.bottom{width:calc(100% - 8px);height:var(--bt);left:4px;top:calc((var(--bh) - var(--bt))/2);background:repeating-linear-gradient(0deg,#f4ecd9 0 2px,#d6c9ad 2px 3px)}
.top{transform:rotateX(90deg) translateZ(calc(var(--bh)/2 - 4px))}
.bottom{transform:rotateX(-90deg) translateZ(calc(var(--bh)/2 - 4px))}
.shadow{position:absolute;bottom:8px;left:50%;width:calc(var(--bw)*.8);height:26px;margin-left:calc(var(--bw)*-.4);background:radial-gradient(ellipse at center,rgba(0,0,0,.45),transparent 70%);filter:blur(5px)}
main>p.hint{text-align:center;margin:0 0 14px;font-size:13px}
.reveal{opacity:0;transform:perspective(700px) rotateX(22deg) translateY(26px);transform-origin:50% 0;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
button.btn{box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .1s,box-shadow .1s}
button.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.hero{box-shadow:0 16px 34px rgba(0,0,0,.32)}
.hero button.btn{box-shadow:0 5px 0 #d9cbb5,0 12px 20px rgba(0,0,0,.3)}
.hero button.btn:active{box-shadow:0 1px 0 #d9cbb5}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
.social{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 14px}
.social a{background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 16px;text-decoration:none;font-weight:600;color:var(--brand)}
footer .social{margin:0 0 10px}

/* ===== ጥቁር ሲኒማዊ ዲዛይን ===== */
:root{--bg:#09070d;--card:#15111c;--ink:#f3ead6;--muted:#a99f8c;--brand:#d8b25a;--brand2:#f0cf86;--line:#2e2638}
body{background:var(--bg);color:var(--ink);overflow-x:hidden}
body::before{background:linear-gradient(rgba(9,7,13,.88),rgba(9,7,13,.93)),url('bg.jpg') center 18%/cover no-repeat}
main>h2,main>p.muted,footer{background:rgba(21,17,28,.82);color:var(--ink)}
footer{color:var(--muted)}footer a{color:var(--muted)}
header{position:sticky;top:0;z-index:20;background:rgba(14,10,20,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header h1{color:var(--brand)}
nav button{color:var(--brand);border-color:#d8b25a55}
.card{box-shadow:0 10px 30px rgba(0,0,0,.45)}
button.btn{background:var(--brand);color:#1a1208;font-weight:700;box-shadow:0 4px 0 #8f7230,0 10px 22px rgba(0,0,0,.4)}
button.btn:active{box-shadow:0 1px 0 #8f7230}
button.btn.alt{background:transparent;color:var(--brand);border:1px solid var(--brand);box-shadow:none}
button.btn.red{background:#a32d2d;color:#fff;box-shadow:0 4px 0 #6d1d1d}
input,select{background:#0f0c14;color:var(--ink);border-color:var(--line)}
.msg{background:#3a2f12;color:var(--ink)}.msg.err{background:#4a1c1c}.msg.ok{background:#17351f}
.pending{background:#4a3b12;color:#f3ead6}.approved{background:#17351f;color:#dff3df}.rejected{background:#4a1c1c;color:#fbdcdc}
.wm{color:#ffffff30}
.back,a{color:var(--brand)}
.social a{background:#15111c;border-color:var(--line);color:var(--brand)}
/* scroll ትዕይንት */
.scene{position:relative;height:520vh;width:100vw;margin-left:calc(50% - 50vw);margin-top:-16px}
.pin{position:sticky;top:var(--hh,56px);height:calc(100vh - var(--hh,56px));height:calc(100svh - var(--hh,56px));overflow:hidden}
.pin::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 45% at 50% 0%,rgba(122,76,190,.5),transparent 70%),radial-gradient(ellipse 60% 35% at 50% 100%,rgba(216,178,90,.16),transparent 70%)}
.pin::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;background:linear-gradient(to top,rgba(9,7,13,.92),rgba(9,7,13,0))}
.pin .stage{--bw:min(50vw,34vh,300px);position:absolute;left:0;right:0;top:2vh;margin:0;z-index:1}
.pin .book{will-change:transform}
.ring{position:absolute;left:50%;top:50%;width:calc(var(--bw)*2.1);aspect-ratio:1;border-radius:50%;border:clamp(4px,.9vw,8px) solid rgba(255,244,214,.92);box-shadow:0 0 34px 6px rgba(216,178,90,.45),inset 0 0 28px rgba(216,178,90,.4);pointer-events:none;will-change:transform}
.slide{position:absolute;left:0;right:0;bottom:4vh;padding:0 22px;text-align:center;opacity:0;pointer-events:none;z-index:2;will-change:opacity,transform}
.slide h2{margin:0 0 8px;font:700 clamp(38px,11vw,60px)/1.12 'Noto Serif Ethiopic','Noto Sans Ethiopic',serif;color:#f6ecd2;text-shadow:0 0 30px rgba(216,178,90,.35)}
.slide p{margin:0 auto 12px;max-width:36ch;color:#d9cfb9}
.slide .kicker{font-size:12px;letter-spacing:.22em;color:var(--brand);margin-bottom:6px}
.slide .big{font:700 clamp(34px,10vw,48px)/1.1 'Noto Serif Ethiopic','Noto Sans Ethiopic',serif;color:var(--brand);margin:0 0 8px;text-shadow:0 0 26px rgba(216,178,90,.4)}
.slide button.btn,.slide .msg{max-width:360px;margin-left:auto;margin-right:auto}
.slide .cue{display:block;font-size:22px;color:var(--brand);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(8px);opacity:1}}
@media (min-width:820px){
  .pin .stage{left:auto;right:4vw;width:48vw;top:calc(50% - (var(--bh) + 70px)/2)}
  .slide{left:6vw;right:auto;width:42vw;text-align:left;bottom:auto;top:50%;margin-top:-130px}
  .slide p{margin-left:0}
  .slide button.btn,.slide .msg{margin-left:0}
}

/* ===== ተጨማሪ ክፍሎች (ከስሩ) ===== */
.bleed{width:100vw;margin-left:calc(50% - 50vw);position:relative;overflow:hidden}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.sec-t{font:700 clamp(28px,7vw,44px)/1.2 'Noto Serif Ethiopic','Noto Sans Ethiopic',serif;color:#f6ecd2;text-align:center;margin:0 0 6px}
.sec-s{text-align:center;color:var(--muted);margin:0 0 26px}
.marq{padding:46px 0 10px;white-space:nowrap}
.marq-t{display:inline-block;font:700 clamp(70px,24vw,210px)/1 'Noto Serif Ethiopic','Noto Sans Ethiopic',serif;color:transparent;-webkit-text-stroke:1.5px rgba(216,178,90,.55);will-change:transform}
.marq-t b{color:#f6ecd2;-webkit-text-stroke:0}
.planet{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 62%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 62%,transparent);height:78vh;min-height:460px;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;text-align:center}
.planet::before{content:"";position:absolute;left:50%;top:48%;width:190vw;height:190vw;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 50% 0%,rgba(216,178,90,.28),#0b0810 48%);border-top:2px solid rgba(255,232,180,.85);box-shadow:0 -18px 90px rgba(216,178,90,.5),inset 0 30px 80px rgba(216,178,90,.12)}
.planet>div{position:relative;z-index:1;padding:0 22px}
.planet h2{font:700 clamp(30px,8vw,54px)/1.25 'Noto Serif Ethiopic','Noto Sans Ethiopic',serif;color:#f6ecd2;margin:0 0 10px}
.planet h2 em{font-style:normal;color:var(--brand)}
.planet p{color:#cfc4ad;max-width:38ch;margin:0 auto}
.gl{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015));border:1px solid rgba(216,178,90,.22);border-radius:18px;padding:20px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 14px 40px rgba(0,0,0,.45);transition:border-color .3s,box-shadow .3s}
.gl:hover{border-color:rgba(216,178,90,.6);box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 30px rgba(216,178,90,.18)}
.steps{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:820px){.steps{grid-template-columns:repeat(3,1fr)}}
.steps .n{font:700 40px/1 'Noto Serif Ethiopic',serif;color:var(--brand);opacity:.85}
.steps h3{margin:8px 0 4px;color:#f6ecd2}
.steps p{margin:0;color:#cfc4ad;font-size:15px}
.sec{padding:60px 0 10px}
.books-g{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:700px){.books-g{grid-template-columns:1fr 1fr}}
.books-g .gl b{color:#f6ecd2}
.faq details{margin-bottom:10px;padding:0}
.faq summary{cursor:pointer;list-style:none;padding:16px 46px 16px 18px;font-weight:600;color:#f6ecd2;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:24px;color:var(--brand);transition:transform .25s}
.faq details[open] summary::after{transform:translateY(-50%) rotate(45deg)}
.faq details p{margin:0;padding:0 18px 16px;color:#cfc4ad}
.cta{text-align:center;padding:70px 0 40px}
.cta .huge{font:700 clamp(54px,19vw,150px)/1 'Noto Serif Ethiopic','Noto Sans Ethiopic',serif;background:linear-gradient(180deg,#fff3d0,#d8b25a 60%,#8f7230);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0 0 10px;filter:drop-shadow(0 0 28px rgba(216,178,90,.35))}
.cta .big{font:700 clamp(30px,8vw,44px) 'Noto Serif Ethiopic',serif;color:var(--brand);margin-bottom:8px}
.cta button.btn,.cta .msg{max-width:360px;margin-left:auto;margin-right:auto}
.reveal{transform:translateY(30px)}
.social a{display:inline-flex;align-items:center;gap:8px}
.social .ico{width:26px;height:26px;border-radius:7px;display:block}

/* ===== ድምፅ + ወርቃማ ፋይበር ===== */
.ring{display:none}
.fx{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#snd{white-space:nowrap}
#snd.pulse{animation:pls 1.8s ease-in-out infinite}
@keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(216,178,90,.0)}50%{box-shadow:0 0 14px 3px rgba(216,178,90,.55)}}
</style>
</head>

function socialHtml(){
  const items = [['youtube','YouTube'],['instagram','Instagram'],['tiktok','TikTok']]
    .filter(([k]) => /^https:\/\//.test(SOCIAL[k] || ''));
  if (!items.length) return '';
  return `<div class="social">${items.map(([k, l]) =>
    `<a href="${esc(SOCIAL[k])}" target="_blank" rel="noopener noreferrer" aria-label="${l}">${SOCIAL_ICON[k] ? `<img class="ico" src="${SOCIAL_ICON[k]}" alt="">` : '▶ '}<span>${l}</span></a>`).join('')}</div>`;
}

async function init(){
  $('#social-foot').innerHTML = socialHtml();
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (!session){
    const r = await sb.auth.signInAnonymously();
    if (r.error) anonFailed = true; else session = r.data.session;
  }
  await loadAll();
  go('home');
}
async function loadAll(){
  const b = await sb.from('books').select('*').eq('active', true).order('created_at');
  books = b.data || [];
  isAdmin = false;
  if (session && !session.user.is_anonymous){
    const a = await sb.from('admins').select('user_id').maybeSingle();
    isAdmin = !!a.data;
  }
  await loadStatus();
  renderNav(); Snd.ui();
}
async function loadStatus(){
  myStatus = 'none';
  if (!session) return;
  const { data } = await sb.rpc('my_status');
  if (data) myStatus = data;
}
function renderNav(){
  $('#nav').innerHTML = `<button id="snd" onclick="Snd.toggle()"></button><button onclick="go('library')">🎧 አዳምጥ</button>` +
    (isAdmin ? `<button onclick="go('admin')">አድሚን ገጽ</button><button onclick="adminLogout()">ውጣ</button>` : '');
  Snd.ui();
}
function go(view, arg){
  window.scrollTo(0,0); Snd.view(view);
  ({home, buy, claim, library, admin, adminLogin})[view](arg);
}


/* ---------- ድምፅ (በ Web Audio የተሠራ፣ ምንም ፋይል አያስፈልግም) ---------- */
const Snd = {
  on: false, ctx: null, vol: 1, v: 'home', ducked: false, lastIdx: -1,
  init(){
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return false;
    const c = this.ctx = new C();
    const m = this.master = c.createGain(); m.gain.value = 0; m.connect(c.destination);
    const lp = this.lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380; lp.Q.value = .7; lp.connect(m);
    [[55, 'sine', .5], [82.41, 'sine', .32], [110.2, 'triangle', .18], [164.8, 'sine', .1]].forEach(([f, ty, g]) => {
      const o = c.createOscillator(); o.type = ty; o.frequency.value = f; o.detune.value = (Math.random() - .5) * 12;
      const gg = c.createGain(); gg.gain.value = g * .22; o.connect(gg); gg.connect(lp); o.start();
    });
    const lfo = c.createOscillator(); lfo.frequency.value = .07;
    const lg = c.createGain(); lg.gain.value = 120; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    const buf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const n = c.createBufferSource(); n.buffer = buf; n.loop = true;
    const bp = this.bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = .6;
    const air = this.air = c.createGain(); air.gain.value = 0;
    n.connect(bp); bp.connect(air); air.connect(m); n.start();
    const dl = c.createDelay(1); dl.delayTime.value = .32; const fb = c.createGain(); fb.gain.value = .35;
    dl.connect(fb); fb.connect(dl); dl.connect(m); this.dl = dl;
    return true;
  },
  level(){ return this.on && !this.ducked ? (this.v === 'home' ? .55 : .2) * this.vol : 0; },
  apply(){ if (this.ctx) this.master.gain.setTargetAtTime(this.level(), this.ctx.currentTime, .4); },
  toggle(){
    if (!this.ctx && !this.init()) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.on = !this.on; this.apply(); this.ui();
    try { localStorage.setItem('snd', this.on ? '1' : '0'); } catch (_) {}
    if (this.on) this.bell(2);
  },
  ui(){
    const b = document.getElementById('snd'); if (!b) return;
    b.textContent = this.on ? '🔊 ድምፅ' : '🔇 ድምፅ';
    b.classList.toggle('pulse', !this.on);
  },
  view(v){ this.v = v; this.apply(); },
  duck(d){ this.ducked = d; this.apply(); },
  update(p, vel){
    if (!this.ctx || !this.on) return; const t = this.ctx.currentTime;
    this.lp.frequency.setTargetAtTime(300 + p * 1100, t, .3);
    this.air.gain.setTargetAtTime(Math.min(.3, vel * .01), t, .12);
    this.bp.frequency.setTargetAtTime(500 + vel * 40 + p * 900, t, .15);
  },
  bell(i){
    if (!this.ctx || !this.on) return; const c = this.ctx, t = c.currentTime;
    const f = [440, 523.25, 659.25, 784, 880][((i % 5) + 5) % 5];
    [[1, .5], [2.01, .18], [3.97, .07]].forEach(([k, g]) => {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f * k;
      const e = c.createGain(); e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(g * .5, t + .01);
      e.gain.exponentialRampToValueAtTime(.0001, t + 2.4);
      o.connect(e); e.connect(this.master); e.connect(this.dl); o.start(t); o.stop(t + 2.5);
    });
  },
  tick(){
    if (!this.ctx || !this.on) return; const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(1800, t); o.frequency.exponentialRampToValueAtTime(900, t + .06);
    const e = c.createGain(); e.gain.setValueAtTime(.12, t); e.gain.exponentialRampToValueAtTime(.0001, t + .08);
    o.connect(e); e.connect(this.master); o.start(t); o.stop(t + .1);
  }
};
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('button,a,summary') && !e.target.closest('#snd')) Snd.tick(); });
document.addEventListener('play', e => { if (e.target.tagName === 'AUDIO') Snd.duck(true); }, true);
['pause', 'ended'].forEach(ev => document.addEventListener(ev, e => { if (e.target.tagName === 'AUDIO') Snd.duck(false); }, true));

/* ---------- ጥቁር ትዕይንት: ሲሸራትቱ መጽሐፉ ይሽከረከራል ---------- */
function initFx(){
  try {
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    initBook(reduce);
    const cards = document.querySelectorAll('#app .card, #app .gl');
    if (!reduce && 'IntersectionObserver' in window){
      const io = new IntersectionObserver(es => es.forEach(en => {
        if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
      }), { threshold: .12 });
      cards.forEach(c => { c.classList.add('reveal'); io.observe(c); });
    }
  } catch (e) { /* ተጽእኖው ባይሰራ ገጹ ይሰራል */ }
}


const FIB = Array.from({ length: 200 }, (_, i) => ({ u: i / 200, ph: Math.random() * 6.28, L: Math.random(), w: Math.random() }));
function drawFibers(t, p, stage, pin, bw, bh){
  const cv = document.getElementById('fx'); if (!cv) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2), pr = pin.getBoundingClientRect();
  const W = Math.round(pr.width * dpr), H = Math.round(pr.height * dpr);
  if (cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, pr.width, pr.height);
  const sr = stage.getBoundingClientRect(), cx = sr.left + sr.width / 2 - pr.left, cy = sr.top + sr.height / 2 - pr.top;
  const ease = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
  const mA = ease(p / .45), mB = ease((p - .45) / .4), n = pr.width < 600 ? 120 : 200;
  g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
  for (let k = 0; k < n; k++){
    const f = FIB[Math.floor(k * FIB.length / n)], u = k / n;
    // 1) ተንጠልጣይ
    const sway = Math.sin(t * .8 + f.ph) * 10, hx0 = cx + (u - .5) * bw * 1.6 + sway * .3, hy0 = -10;
    const hx1 = hx0 + sway + (u - .5) * 24, hy1 = bh * (.35 + f.L * .55);
    // 2) ቅስት
    const th1 = -Math.PI + u * Math.PI, R1 = bh * .62, l1 = 16 + f.L * 46;
    const ax0 = cx + Math.cos(th1) * R1, ay0 = cy + Math.sin(th1) * R1, ax1 = cx + Math.cos(th1) * (R1 + l1), ay1 = cy + Math.sin(th1) * (R1 + l1);
    // 3) ቀለበት
    const th2 = u * Math.PI * 2 + t * .06, R2 = bh * .6, l2 = 18 + f.L * 50 + Math.sin(t * 2 + f.ph) * 4;
    const rx0 = cx + Math.cos(th2) * R2, ry0 = cy + Math.sin(th2) * R2, rx1 = cx + Math.cos(th2) * (R2 + l2), ry1 = cy + Math.sin(th2) * (R2 + l2);
    const L = (a, b, m) => a + (b - a) * m;
    let x0 = L(hx0, ax0, mA), y0 = L(hy0, ay0, mA), x1 = L(hx1, ax1, mA), y1 = L(hy1, ay1, mA);
    x0 = L(x0, rx0, mB); y0 = L(y0, ry0, mB); x1 = L(x1, rx1, mB); y1 = L(y1, ry1, mB);
    g.strokeStyle = `rgba(216,${150 + f.w * 50 | 0},${60 + f.w * 40 | 0},${.28 + f.L * .4})`;
    g.lineWidth = .8 + f.w * 1.6;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    g.fillStyle = `rgba(255,226,140,${.55 + .4 * Math.sin(t * 3 + f.ph)})`;
    g.beginPath(); g.arc(x1, y1, 1 + f.L * 1.8, 0, 6.283); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
}

function initBook(reduce){
  const stage = $('#stage'), scene = $('#scene'); if (!stage || !scene) return;
  const pin = scene.querySelector('.pin');
  const book = stage.querySelector('.book'), shadow = stage.querySelector('.shadow'),
        shine = stage.querySelector('.shine'), ring = stage.querySelector('.ring');
  const slides = [...scene.querySelectorAll('.slide')];
  const hd = document.querySelector('header');
  const ranges = [[-9, .15], [.3, .45], [.58, .72], [.86, 9]], F = .045;
  let drag = false, lastX = 0, offY = 0, offX = 0, lastY = 0, vel = 0, amp = 1, sp = -1;
  stage.addEventListener('pointerdown', e => {
    drag = true; lastX = e.clientX; lastY = e.clientY; vel = 0;
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  });
  stage.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    vel = dx * .7; offY += vel;
    offX = Math.max(-25, Math.min(25, offX - dy * .3));
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => stage.addEventListener(ev, () => { drag = false; }));
  const t0 = performance.now();
  (function frame(now){
    if (!document.body.contains(stage)) return;          // ገጹ ሲቀየር ይቆማል
    const hh = hd.offsetHeight;
    document.documentElement.style.setProperty('--hh', hh + 'px');
    const r = scene.getBoundingClientRect();
    const total = Math.max(1, r.height - pin.offsetHeight);
    const raw = Math.min(1, Math.max(0, (hh - r.top) / total));
    sp = sp < 0 || reduce ? raw : sp + (raw - sp) * .12;
    const p = sp, t = (now - t0) / 1000;
    if (!drag){
      offY += vel; vel *= .94;
      offY = ((offY + 180) % 360 + 360) % 360 - 180;
      offY *= .985; offX *= .94;
    }
    amp += ((drag || reduce ? 0 : 1) - amp) * .06;
    const ry = 22 + p * 330 + Math.sin(t * .9) * 7 * amp + offY;
    const rx = -7 + Math.sin(p * Math.PI) * 8 + Math.sin(t * .7) * 2 * amp + offX;
    const sc = 1 + .1 * Math.sin(p * Math.PI);
    book.style.transform = `scale(${sc}) rotateX(${rx}deg) rotateY(${ry}deg)`;
    const bw = book.offsetWidth, bh = book.offsetHeight;
    ring.style.transform = `translate(-50%,-50%) translate(${Math.sin(p * Math.PI * 2) * bw * .5}px,${-bh * .04}px) scale(${.92 + .2 * Math.sin(p * Math.PI)})`;
    const cr = ry * Math.PI / 180;
    shadow.style.transform = `scaleX(${Math.max(.35, Math.abs(Math.cos(cr)) + .13 * Math.abs(Math.sin(cr)))})`;
    shine.style.backgroundPosition = `${50 - (ry - 24) * 2.2}% 0`;

    // ወርቃማ ፋይበር: ከላይ የተንጠለጠሉ ክሮች → ቅስት → በመጽሐፉ ዙሪያ ቀለበት
    drawFibers(t, p, stage, pin, bw, bh);
    const sy = scrollY, sv = Math.abs(sy - (frame.ly ?? sy)); frame.ly = sy; frame.sv = (frame.sv || 0) * .85 + sv * .15;
    Snd.update(p, frame.sv + Math.abs(vel) * .5);
    let bi = -1, bwt = .5;
    slides.forEach((el, i) => { const o = +el.style.opacity; if (o > bwt){ bwt = o; bi = i; } });
    if (bi >= 0 && bi !== Snd.lastIdx){ Snd.lastIdx = bi; Snd.bell(bi); }
    slides.forEach((el, i) => {
      const [a, b] = ranges[i];
      const w = Math.max(0, Math.min(1, (p - (a - F)) / F)) * Math.max(0, Math.min(1, ((b + F) - p) / F));
      el.style.opacity = w;
      el.style.transform = `translateY(${(p < a ? -1 : 1) * (1 - w) * 70}px)`;
      el.style.pointerEvents = w > .6 ? 'auto' : 'none';
    });
    document.querySelectorAll('.marq-t').forEach(el => {
      const rr = el.parentElement.getBoundingClientRect();
      el.style.transform = `translateX(${(rr.top - innerHeight / 2) * (el.dataset.dir === 'r' ? -.9 : .9)}px)`;
    });
    requestAnimationFrame(frame);
  })(performance.now());
}

      <ol>
        <li><b>ቴሌብር:</b> <b>${fmt(BUNDLE_PRICE)} ብር</b> ወደ <b>${esc(TELEBIRR_NUMBER)}</b> (${esc(TELEBIRR_NAME)}) ይላኩ።</li>
        ${CBE_ACCOUNT ? `<li><b>ንግድ ባንክ:</b> ወደ ሂሳብ ቁጥር <b>${esc(CBE_ACCOUNT)}</b> (${esc(CBE_NAME)}) ያስተላልፉ።</li>` : ''}
        <li>ከላኩ በኋላ በሚደርስዎ የክፍያ መልዕክት (ደረሰኝ) ላይ ያለውን <b>የግብይት ቁጥር</b> ከዚህ በታች ያስገቡ።</li>
      </ol>
      <select id="meth"><option value="telebirr">ቴሌብር</option>${CBE_ACCOUNT ? '<option value="cbe">ንግድ ባንክ</option>' : ''}</select>
      <input id="ref" placeholder="የግብይት ቁጥር (ከደረሰኙ)" autocomplete="off">
      <div id="omsg"></div>
      <button class="btn" onclick="submitOrder()">ክፍያ ፈጽሜያለሁ</button>
      <p class="muted">ይህ ግዢ በዚህ ስልክ ላይ ብቻ ይሰራል (አንድ ክፍያ = አንድ ስልክ)። የደረሰኝ ቁጥርዎን ያስቀምጡ፤ ስልክ ከቀየሩ ያነጋግሩን።<br>${esc(CONTACT)}</p>
    </div>`;
}
async function submitOrder(){
  const ref = $('#ref').value.trim();
  const show = (t, cls='err') => $('#omsg').innerHTML = `<div class="msg ${cls}">${t}</div>`;
  if (ref.length < 6) return show('የግብይት ቁጥሩን በትክክል ያስገቡ።');
  const { data, error } = await sb.rpc('create_order', { p_method: $('#meth').value, p_ref: ref });
  if (error || data === 'invalid' || data === 'no_session') return show('ስህተት ተፈጥሯል፣ ገጹን አድሰው እንደገና ይሞክሩ።');
  if (data === 'duplicate') return show('ይህ የግብይት ቁጥር ቀድሞ ተመዝግቧል። ቀድሞ የከፈሉ ከሆነ ከመነሻ ገጽ "በሌላ ስልክ ያዳምጡ" ን ይጠቀሙ።');
  await loadStatus();
  go('home');
}

/* ---------- ቀድሞ የከፈለ በሌላ ስልክ ---------- */
function claim(){
  app.innerHTML = `
    <button class="back" onclick="go('home')">← ተመለስ</button>
    <div class="card">
      <h2 style="margin-top:0">ስልክ ቀይረዋል?</h2>
      <p class="muted">አንድ ክፍያ በአንድ ስልክ ላይ ብቻ ይሰራል። ወደ አዲስ ስልክ ለመመለስ መጀመሪያ እኛን ያነጋግሩ፣ ከቀድሞ ስልክዎ እናላቅቃለን፤ ከዚያ እዚህ የግብይት ቁጥርዎን ያስገቡ።<br>${esc(CONTACT)}</p>
      <input id="ref" placeholder="የግብይት ቁጥር" autocomplete="off">
      <div id="cmsg"></div>
      <button class="btn" onclick="doClaim()">አረጋግጥ</button>
    </div>`;
}
async function doClaim(){
  const show = (t, cls='err') => $('#cmsg').innerHTML = `<div class="msg ${cls}">${t}</div>`;
  const { data, error } = await sb.rpc('claim_access', { p_ref: $('#ref').value });
  if (error || data === 'no_session') return show('ስህተት ተፈጥሯል፣ እንደገና ይሞክሩ።');
  if (data === 'not_found') return show('ይህ የግብይት ቁጥር አልተገኘም።');
  if (data === 'limit') return show('ይህ ክፍያ ቀድሞ በሌላ ስልክ ላይ ጥቅም ላይ ውሏል። ስልክ ከቀየሩ ያነጋግሩን።');
  await loadStatus();
  go('home');
}

/* ---------- ማዳመጫ ---------- */
function library(){
  if (myStatus !== 'approved'){
    app.innerHTML = `<div class="card"><p>${myStatus === 'pending'
      ? 'ክፍያዎ እየተረጋገጠ ነው። ሲጸድቅ እዚህ ማዳመጥ ይችላሉ።'
      : 'ለማዳመጥ መጀመሪያ ስብስቡን ይግዙ።'}</p>
      <button class="btn" onclick="go('home')">ወደ መነሻ</button></div>`;
    return;
  }
  app.innerHTML = `<h2>የእርስዎ መጽሐፍት</h2>` + books.map(b => `
    <div class="card">
      <b>${esc(b.title)}</b> <span class="muted">${esc(b.author)}</span>
      <div id="pl-${b.id}"><button class="btn" onclick="play('${b.id}')">▶ አዳምጥ</button></div>
    </div>`).join('');
}
async function play(id){
  const b = books.find(x => x.id === id);
  const box = $('#pl-' + id); box.innerHTML = '<p class="muted">በመጫን ላይ...</p>';
  const { data, error } = await sb.storage.from('audio').createSignedUrl(b.audio_path, 900);
  if (error) return box.innerHTML = `<div class="msg err">ማጫወት አልተቻለም። ኦዲዮው ገና ላይጫን ይችላል፤ እባክዎ ያነጋግሩን።</div>`;
  const code = session ? session.user.id.slice(0, 6) : '';
  box.innerHTML = `<div class="player"><span class="wm">${esc(code)}</span>
    <audio id="au-${id}" controls controlsList="nodownload noplaybackrate" preload="metadata" src="${data.signedUrl}"></audio></div>`;
  const au = $('#au-' + id);
  au.addEventListener('contextmenu', e => e.preventDefault());
  au.addEventListener('error', async () => {
    const t = au.currentTime;
    const r = await sb.storage.from('audio').createSignedUrl(b.audio_path, 900);
    if (r.data){ au.src = r.data.signedUrl; au.currentTime = t; au.play(); }
  });
}
document.addEventListener('contextmenu', e => { if (e.target.tagName === 'AUDIO') e.preventDefault(); });

/* ---------- አድሚን (ለባለቤቱ ብቻ፣ በኢሜይል) ---------- */
function adminLogin(){
  if (isAdmin) return go('admin');
  app.innerHTML = `
    <div class="card" style="max-width:420px;margin:auto">
      <h2>አድሚን መግቢያ</h2>
      <input id="em" type="email" placeholder="ኢሜይል">
      <input id="apw" type="password" placeholder="የይለፍ ቃል">
      <div id="amsg"></div>
      <button class="btn" onclick="doAdminLogin()">ግባ</button>
    </div>`;
}
async function doAdminLogin(){
  const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#apw').value });
  if (error) return $('#amsg').innerHTML = `<div class="msg err">ኢሜይል ወይም የይለፍ ቃል ትክክል አይደለም (ወይም ኢሜይሉ አልተረጋገጠም)።</div>`;
  const { data } = await sb.auth.getSession(); session = data.session;
  await loadAll();
  if (!isAdmin) return $('#amsg').innerHTML = `<div class="msg err">ይህ መለያ አድሚን አይደለም።</div>`;
  go('admin');
}
async function adminLogout(){
  await sb.auth.signOut(); session = null; isAdmin = false;
  const r = await sb.auth.signInAnonymously(); if (!r.error) session = r.data.session;
  await loadAll(); go('home');
}
async function admin(){
  if (!isAdmin) return go('adminLogin');
  const { data } = await sb.from('orders').select('*').order('created_at', { ascending: false });
  app.innerHTML = `<h2>የክፍያ ማረጋገጫ</h2>` + ((data || []).map(o => `
    <div class="card">
      <span class="tag ${o.status}">${statusAm[o.status]}</span>
      <span class="muted">${o.method==='telebirr'?'ቴሌብር':'ንግድ ባንክ'} · ${new Date(o.created_at).toLocaleString('am-ET')}</span><br>
      የግብይት ቁጥር: <b>${esc(o.reference)}</b>
      ${o.status==='pending' ? `
        <button class="btn" onclick="setStatus('${o.id}','approved')">አጽድቅ ✔</button>
        <button class="btn red" onclick="setStatus('${o.id}','rejected')">ውድቅ አድርግ ✖</button>` : ''}
      ${o.status==='approved' ? `<button class="btn alt" onclick="resetDevice('${o.id}')">ስልክ ቀይር (ከቀድሞ ስልክ አላቅቅ)</button>` : ''}
    </div>`).join('') || '<p>ምንም ጥያቄ የለም።</p>');
}
async function setStatus(id, status){
  await sb.from('orders').update({ status }).eq('id', id);
  admin();
}
async function resetDevice(id){
  if (!confirm('ይህን ክፍያ ከቀድሞ ስልኩ ልታላቅቀው ነው። ገዢው በአዲስ ስልክ በግብይት ቁጥሩ መመለስ ይችላል። ይቀጥል?')) return;
  const { error } = await sb.from('grants').delete().eq('order_id', id);
  alert(error ? 'አልተሳካም፣ እንደገና ይሞክሩ።' : 'ተላቅቋል። ገዢው አሁን በአዲስ ስልክ በግብይት ቁጥሩ መመለስ ይችላል።');
}

init();
</script>
</body>
</html>
